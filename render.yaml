# Render Blueprint — deploy automático (free tier)
# build  : npm ci + build del backend (prisma generate incluido)
# start  : migrate deploy + arranque (API + workers de comentarios/campañas en 1 proceso)
#
# Las variables marcadas con `sync: false` se completan a mano en:
# Render > Dashboard > tu servicio > Environment.
# Todas las claves necesarias ya existen en apps/backend/.env para usarlas como referencia.
services:
  - type: web
    name: publication-automation-api
    runtime: node
    plan: free
    rootDir: .
    healthCheckPath: /api/v1/health
    buildCommand: npm ci && npm run build:backend
    startCommand: npm run start:backend:prod
    envVars:
      - key: NODE_ENV
        value: production

      # Supabase (revisado): DATABASE_URL = pooler :6543?pgbouncer=true (runtime)
      # DIRECT_URL = conexión directa :5432 (Prisma la usa SOLO para migrar)
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false

      - key: PORT
        value: 3001
      - key: FRONTEND_URL
        sync: false # URL del frontend desplegado (https://...onrender.com)
      - key: CORS_ORIGINS
        sync: false # misma URL del frontend

      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_SECRET
        sync: false
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 7d
      - key: TOKEN_ENCRYPTION_KEY
        sync: false # HEX de 64 caracteres

      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: FACEBOOK_API_VERSION
        value: v26.0
      - key: META_OAUTH_REDIRECT_URI
        sync: false # https://TU-FRONTEND.vercel.app/oauth/callback (el callback vive en la web)
      - key: META_WEBHOOK_VERIFY_TOKEN
        sync: false

      - key: RECAPTCHA_SECRET_KEY
        sync: false

      - key: AI_PROVIDER
        value: groq
      - key: AI_MODEL
        value: openai/gpt-oss-120b
      - key: AI_API_KEY
        sync: false

      - key: WORKER_CONCURRENCY
        value: 10
      - key: WORKER_LEASE_MS
        value: 60000
      - key: WORKER_MAX_ATTEMPTS
        value: 5
      - key: WORKER_RETRY_BACKOFF_MS
        value: 30000